# Used by the custom-config scenario in compat_test.py. Mounted at
# /etc/nginx/conf.d/api.conf inside both upstream and our containers to verify
# they handle a user-supplied conf.d/*.conf file identically. Listens on 8081
# so it doesn't collide with default.conf's listen 80.
server {
    listen       8081;
    server_name  _;

    location /api {
        default_type text/plain;
        return 200 "compat-test api\n";
    }
}
